<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0F172A">
    <title>VolareVision - Route Optimization Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Design tokens: see design-system/volarevision/ (generated with the ui-ux-pro-max skill) -->
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Fira Sans", ui-sans-serif, system-ui, sans-serif;
            --font-mono: "Fira Code", ui-monospace, monospace;

            --color-background: #0F172A;
            --color-surface: #192134;
            --color-field: #10182B;
            --color-field-border: #3B4A63;
            --color-hairline: rgb(255 255 255 / 0.08);
            --color-foreground: #F8FAFC;
            --color-muted: #94A3B8;
            --color-primary: #2563EB;
            --color-primary-hover: #1D4ED8;
            --color-on-primary: #FFFFFF;
            --color-ring: #60A5FA;
            --color-danger: #F87171;

            --color-route-fuel: #22C55E;
            --color-route-pax: #3B82F6;
            --color-route-profit: #F97316;
        }
    </style>
    <style>
        html, body, #map { height: 100%; width: 100%; margin: 0; padding: 0; }
        .leaflet-container { background: #0F172A; font-family: "Fira Sans", system-ui, sans-serif; }
        .panel { z-index: 1000; }

        .leaflet-interactive {
            transition: r 0.25s ease-out, stroke 0.2s ease, stroke-width 0.2s ease, fill-opacity 0.2s ease;
        }

        /* Route lines fade in once drawn */
        @keyframes routeIn { from { opacity: 0; } to { opacity: 1; } }
        .route-line { animation: routeIn 0.4s ease-out both; }

        /* Visible keyboard focus everywhere */
        :where(a, button, input, select, [tabindex]):focus-visible {
            outline: 2px solid #60A5FA;
            outline-offset: 2px;
        }

        .field[aria-invalid="true"] { border-color: #F87171; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 0.8s linear infinite; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="bg-background font-sans text-foreground overflow-hidden antialiased">

    <div id="map" class="absolute inset-0" role="region" aria-label="Route map"></div>

    <!-- Control panel: bottom sheet on mobile, floating sidebar from md up -->
    <aside class="panel absolute inset-x-0 bottom-0 max-h-[62vh] rounded-t-2xl
                  md:inset-x-auto md:top-4 md:left-4 md:bottom-4 md:max-h-none md:w-96 md:rounded-2xl
                  bg-surface/95 backdrop-blur-md border border-hairline shadow-2xl overflow-y-auto overscroll-contain"
           aria-label="Route optimization controls">
        <div class="p-5 space-y-5">
            <header class="flex items-center gap-3">
                <div class="text-ring bg-primary/15 p-2 rounded-lg border border-primary/30 flex items-center justify-center" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M6.428 1.151C6.708.591 7.213 0 8 0s1.292.592 1.572 1.151C9.861 1.73 10 2.431 10 3v3.691l5.17 2.585a1.5 1.5 0 0 1 .83 1.342V12a.5.5 0 0 1-.582.493l-5.507-.918-.375 2.253 1.318 1.318A.5.5 0 0 1 10.5 16h-5a.5.5 0 0 1-.354-.854l1.319-1.318-.376-2.253-5.507.918A.5.5 0 0 1 0 12v-1.382a1.5 1.5 0 0 1 .83-1.342L6 6.691V3c0-.568.14-1.271.428-1.849m.894.448C7.111 2.02 7 2.569 7 3v4a.5.5 0 0 1-.276.447l-5.448 2.724a.5.5 0 0 0-.276.447v.792l5.418-.903a.5.5 0 0 1 .575.41l.5 3a.5.5 0 0 1-.14.437L6.708 15h2.586l-.647-.646a.5.5 0 0 1-.14-.436l.5-3a.5.5 0 0 1 .576-.411L15 11.41v-.792a.5.5 0 0 0-.276-.447L9.276 7.447A.5.5 0 0 1 9 7V3c0-.432-.11-.979-.322-1.401C8.458 1.159 8.213 1 8 1s-.458.158-.678.599"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-semibold leading-tight">VolareVision</h1>
                    <p class="text-xs text-muted">Multi-objective route &amp; fare optimizer</p>
                </div>
            </header>

            <p id="airportStatus" class="text-xs text-muted flex items-center gap-2" role="status" aria-live="polite">
                <svg class="spinner size-3.5" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity="0.25" stroke-width="4"/><path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
                Loading airport database…
            </p>

            <form id="optForm" class="space-y-4" novalidate>
                <div id="formError" class="hidden rounded-lg border border-danger/50 bg-danger/10 p-3 text-sm text-danger flex gap-2" role="alert" tabindex="-1">
                    <svg class="size-4 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                    <span id="formErrorText"></span>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="origin" class="block text-xs font-medium text-muted mb-1.5">Origin</label>
                        <input type="text" id="origin" list="airportOptions" autocomplete="off" spellcheck="false"
                               placeholder="e.g. JFK" aria-describedby="origin-error"
                               class="field w-full h-11 bg-field border border-field-border rounded-lg px-3 font-mono uppercase text-foreground placeholder:text-muted/70 placeholder:normal-case transition-colors duration-200 focus:border-ring focus:outline-none">
                        <p id="origin-error" class="hidden mt-1 text-xs text-danger"></p>
                    </div>
                    <div>
                        <label for="destination" class="block text-xs font-medium text-muted mb-1.5">Destination</label>
                        <input type="text" id="destination" list="airportOptions" autocomplete="off" spellcheck="false"
                               placeholder="e.g. LAX" aria-describedby="destination-error"
                               class="field w-full h-11 bg-field border border-field-border rounded-lg px-3 font-mono uppercase text-foreground placeholder:text-muted/70 placeholder:normal-case transition-colors duration-200 focus:border-ring focus:outline-none">
                        <p id="destination-error" class="hidden mt-1 text-xs text-danger"></p>
                    </div>
                </div>
                <datalist id="airportOptions"></datalist>

                <div>
                    <label for="aircraft_type" class="block text-xs font-medium text-muted mb-1.5">Aircraft</label>
                    <select id="aircraft_type" class="w-full h-11 bg-field border border-field-border rounded-lg px-3 text-foreground cursor-pointer transition-colors duration-200 focus:border-ring focus:outline-none">
                        <optgroup label="Narrowbody (short–medium haul)">
                            <option value="b738">Boeing 737-800</option>
                            <option value="a20n">Airbus A320neo</option>
                            <option value="a21n">Airbus A321neo</option>
                            <option value="a320">Airbus A320-200</option>
                            <option value="b38m">Boeing 737 MAX 8</option>
                            <option value="b39m">Boeing 737 MAX 9</option>
                            <option value="a223">Airbus A220-300</option>
                            <option value="b752">Boeing 757-200</option>
                            <option value="e295">Embraer E195-E2</option>
                            <option value="a19n">Airbus A319neo</option>
                        </optgroup>
                        <optgroup label="Widebody (long haul)">
                            <option value="b77w" selected>Boeing 777-300ER</option>
                            <option value="b789">Boeing 787-9 Dreamliner</option>
                            <option value="a359">Airbus A350-900</option>
                            <option value="b78x">Boeing 787-10 Dreamliner</option>
                            <option value="a35k">Airbus A350-1000</option>
                            <option value="a333">Airbus A330-300</option>
                            <option value="a339">Airbus A330-900neo</option>
                            <option value="b772">Boeing 777-200ER</option>
                            <option value="a388">Airbus A380-800</option>
                            <option value="b748">Boeing 747-8I</option>
                        </optgroup>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="fuel_price" class="block text-xs font-medium text-muted mb-1.5">Fuel price <span class="text-muted/80">($/gal)</span></label>
                        <input type="number" id="fuel_price" value="3.50" step="0.1" min="0" inputmode="decimal" aria-describedby="fuel_price-error"
                               class="field w-full h-11 bg-field border border-field-border rounded-lg px-3 font-mono text-foreground transition-colors duration-200 focus:border-ring focus:outline-none">
                        <p id="fuel_price-error" class="hidden mt-1 text-xs text-danger"></p>
                    </div>
                    <div>
                        <label for="ticket_price" class="block text-xs font-medium text-muted mb-1.5">Avg ticket <span class="text-muted/80">($)</span></label>
                        <input type="number" id="ticket_price" value="450" step="10" min="1" inputmode="decimal" aria-describedby="ticket_price-error"
                               class="field w-full h-11 bg-field border border-field-border rounded-lg px-3 font-mono text-foreground transition-colors duration-200 focus:border-ring focus:outline-none">
                        <p id="ticket_price-error" class="hidden mt-1 text-xs text-danger"></p>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-baseline mb-1.5">
                        <label for="passenger_demand" class="text-xs font-medium text-muted">Passenger demand</label>
                        <output id="demandVal" for="passenger_demand" class="font-mono text-sm text-foreground">1.0×</output>
                    </div>
                    <input type="range" id="passenger_demand" min="0.5" max="1.5" step="0.1" value="1.0" class="w-full h-6 accent-primary cursor-pointer">
                    <div class="flex justify-between text-xs text-muted mt-0.5" aria-hidden="true"><span>0.5×</span><span>1.5×</span></div>
                </div>

                <div class="grid grid-cols-3 gap-2 pt-1">
                    <button type="submit" id="optimizeBtn"
                            class="col-span-2 h-11 inline-flex items-center justify-center gap-2 bg-primary hover:bg-primary-hover text-on-primary font-medium rounded-lg transition-colors duration-200 cursor-pointer disabled:opacity-70 disabled:cursor-wait">
                        <svg id="optimizeSpinner" class="spinner size-4 hidden" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity="0.3" stroke-width="4"/><path d="M22 12a10 10 0 0 0-10-10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
                        <span id="optimizeLabel">Optimize routes</span>
                    </button>
                    <button type="button" id="resetBtn"
                            class="h-11 bg-transparent hover:bg-white/5 text-foreground font-medium rounded-lg border border-field-border transition-colors duration-200 cursor-pointer">
                        Reset
                    </button>
                </div>
            </form>

            <section id="resultsMatrix" class="hidden pt-5 border-t border-hairline space-y-3" aria-labelledby="results-title" aria-live="polite">
                <div class="flex items-baseline justify-between">
                    <h2 id="results-title" class="text-sm font-semibold">Route options</h2>
                    <p id="resultsRoute" class="font-mono text-xs text-muted"></p>
                </div>
                <div id="resultCards" class="space-y-3"></div>
            </section>
        </div>
    </aside>

    <script src="./app.js"></script>
</body>
</html>
